<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23020617'/%3E%3Cpath d='M8 9h16l-3 5 3 5H8l3-5-3-5Z' fill='%232dd4bf'/%3E%3C/svg%3E" />
    <title>STERN Protocol</title>
    <script>
      // Set the theme class before first paint so there's no flash of the
      // wrong theme while React hydrates.
      (function () {
        try {
          var stored = localStorage.getItem("stern-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (err) {
          /* localStorage/matchMedia unavailable - fall back to the default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
