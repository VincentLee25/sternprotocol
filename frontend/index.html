<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23132B45'/%3E%3Cpath d='M16 6v20M9 12h14M11 21c1.6 2.8 3.1 4 5 4s3.4-1.2 5-4' stroke='%2365BFC4' stroke-width='2.1' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <title>STERN Protocol</title>
    <script>
      // Set the theme class before first paint so there's no flash of the
      // wrong theme while React hydrates. DESIGN.md v2.0 makes light the
      // product default, so the OS preference no longer opts anyone into dark;
      // only an explicit choice does.
      (function () {
        try {
          document.documentElement.classList.toggle(
            "dark",
            localStorage.getItem("stern-theme") === "dark"
          );
        } catch (err) {
          /* localStorage unavailable - fall back to the default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
